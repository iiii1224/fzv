<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A local file viewer for agent-driven development."
    />
    <title>fzv</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="fzv home">fzv</a>
      <span class="project-label" id="project-name">Project</span>
      <button id="find-file" class="toolbar-button" aria-haspopup="dialog">
        <i class="codicon codicon-search" aria-hidden="true"></i>
        Find a file <kbd>/</kbd>
      </button>
      <button
        id="theme-toggle"
        class="toolbar-button"
        aria-label="Switch to dark theme"
        aria-pressed="false"
      >
        <i class="codicon codicon-color-mode" aria-hidden="true"></i
        ><span>Dark</span>
      </button>
    </header>
    <div class="workspace" id="workspace">
      <main id="main" class="main" tabindex="-1">
        <div
          id="tabbar"
          class="tabbar tabs-container"
          role="tablist"
          aria-label="Open files"
        >
          <span id="no-tabs" class="no-tabs">Your workspace</span>
        </div>
        <div class="preview-toolbar">
          <span id="current-path">Ready when you are</span>
          <div class="preview-actions">
            <div
              id="preview-modes"
              class="preview-modes"
              role="group"
              aria-label="Preview mode"
              hidden
            >
              <button
                id="viewer-mode"
                class="toolbar-button"
                aria-pressed="true"
                title="Viewer mode"
              >
                <i class="codicon codicon-preview" aria-hidden="true"></i>
                Viewer
              </button>
              <button
                id="source-mode"
                class="toolbar-button"
                aria-pressed="false"
                title="Source mode"
              >
                <i class="codicon codicon-code" aria-hidden="true"></i> Source
              </button>
            </div>
            <button
              id="reload-file"
              class="toolbar-button"
              aria-label="Reload current file"
              title="Reload current file (r)"
              disabled
            >
              <i class="codicon codicon-refresh" aria-hidden="true"></i>
              <span>Reload</span></button
            ><a
              id="open-file"
              class="toolbar-button"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Open separately"
              title="Open separately"
              hidden
              ><i class="codicon codicon-link-external" aria-hidden="true"></i
              ><span>Open separately</span></a
            >
          </div>
        </div>
        <div id="preview" class="preview">
          <section id="empty-state" class="empty-state">
            <div class="empty-inner">
              <p>Press <kbd>/</kbd> to find a file.</p>
              <p>
                <kbd>f</kbd> jump · <kbd>hjkl</kbd> scroll · <kbd>gg</kbd> top ·
                <kbd>G</kbd> bottom
              </p>
            </div>
          </section>
        </div>
        <div id="notification" class="notification" role="status" hidden></div>
      </main>
    </div>
    <footer class="statusbar">
      <span><span class="status-dot"></span> Read only</span
      ><span id="status-project">Loading project…</span
      ><span id="tab-count">0 open tabs</span>
    </footer>
    <dialog
      id="search-panel"
      class="search-popup quick-input-widget"
      aria-labelledby="search-title"
    >
      <div class="search-heading quick-input-titlebar">
        <h1 id="search-title">Find a file</h1>
        <button
          id="refresh-files"
          class="toolbar-button"
          aria-label="Refresh file list"
          title="Refresh file list"
        >
          <i class="codicon codicon-refresh" aria-hidden="true"></i> Refresh
        </button>
        <button
          id="close-search"
          class="toolbar-button"
          aria-label="Close file search"
          title="Close file search (Escape)"
        >
          <i class="codicon codicon-close" aria-hidden="true"></i> Esc
        </button>
      </div>
      <label class="search-field quick-input-box">
        <i class="codicon codicon-search" aria-hidden="true"></i>
        <input
          id="search"
          type="search"
          aria-label="Search files"
          placeholder="Find a file or directory…"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
      </label>
      <div
        id="result-count"
        class="result-count"
        role="status"
        aria-live="polite"
      >
        Loading files…
      </div>
      <div
        id="results"
        class="results quick-input-list"
        aria-label="Files"
      ></div>
      <div class="search-footer">↑ ↓ move · Enter open · Esc close</div>
    </dialog>
    <script type="module" src="/app.ts"></script>
  </body>
</html>
