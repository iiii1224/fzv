<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="A local file viewer for agent-driven development."
    />
    <title>fzv</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="fzv home">fzv</a>
      <span class="project-label" id="project-name">Project</span>
      <button id="find-file" class="toolbar-button" aria-haspopup="dialog">
        Find a file <kbd>f</kbd>
      </button>
    </header>
    <div class="workspace" id="workspace">
      <main id="main" class="main" tabindex="-1">
        <div id="tabbar" class="tabbar" role="tablist" aria-label="Open files">
          <span id="no-tabs" class="no-tabs">Your workspace</span>
        </div>
        <div class="preview-toolbar">
          <span id="current-path">Ready when you are</span>
          <div class="preview-actions">
            <button
              id="reload-file"
              class="toolbar-button"
              aria-label="Reload current file"
              title="Reload current file (r)"
              disabled
            >
              ↻ <span>Reload</span></button
            ><a
              id="open-file"
              class="toolbar-button"
              target="_blank"
              rel="noopener noreferrer"
              hidden
              >Open separately ↗</a
            >
          </div>
        </div>
        <div id="preview" class="preview">
          <section id="empty-state" class="empty-state">
            <div class="empty-inner">
              <p>Press <kbd>f</kbd> to find a file.</p>
            </div>
          </section>
        </div>
        <div id="notification" class="notification" role="status" hidden></div>
      </main>
    </div>
    <footer class="statusbar">
      <span><span class="status-dot"></span> Read only</span
      ><span id="status-project">Loading project…</span
      ><span id="tab-count">0 open tabs</span>
    </footer>
    <dialog
      id="search-panel"
      class="search-popup"
      aria-labelledby="search-title"
    >
      <div class="search-heading">
        <h1 id="search-title">Find a file</h1>
        <button
          id="refresh-files"
          class="toolbar-button"
          aria-label="Refresh file list"
          title="Refresh file list"
        >
          Refresh
        </button>
        <button
          id="close-search"
          class="toolbar-button"
          aria-label="Close file search"
          title="Close file search (Escape)"
        >
          Esc
        </button>
      </div>
      <label class="search-field">
        <span aria-hidden="true">&gt;</span>
        <input
          id="search"
          type="search"
          aria-label="Search files"
          placeholder="Find a file or directory…"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
      </label>
      <div
        id="result-count"
        class="result-count"
        role="status"
        aria-live="polite"
      >
        Loading files…
      </div>
      <div id="results" class="results" aria-label="Files"></div>
      <div class="search-footer">↑ ↓ move · Enter open · Esc close</div>
    </dialog>
    <script type="module" src="/app.ts"></script>
  </body>
</html>
